<nav class="navbar">
  <div class="nav-logo">FestivalApp</div>
  <div class="nav-links">
    <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
    <a routerLink="festival_list" routerLinkActive="active">Festivals</a>
    <a routerLink="editor-list" routerLinkActive="active">Éditeurs</a>
    <a routerLink="reservation_workflow" routerLinkActive="active">Réservation</a>
    <a routerLink="plan-management" routerLinkActive="active">Zone du Plan</a>
    @if (this.auth_svc.isLoggedIn() && this.auth_svc.currentUser()?.role == 'admin') {
    <a routerLink="admin" routerLinkActive="active">Admin</a>
    }
    @if (!this.auth_svc.isLoggedIn()) {
    <a routerLink="login" class="login-btn" routerLinkActive="active">Connexion</a>
    }
    @if (this.auth_svc.isLoggedIn()) {
        <button class="logout-btn" (click)="logout()">Déconnexion</button>
    }
  </div>
</nav>

<router-outlet />
