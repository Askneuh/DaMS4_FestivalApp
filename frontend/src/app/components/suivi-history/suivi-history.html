<div class="suivi-history">
  <div class="suivi-header">
    <h3>Historique des contacts</h3>
    <button class="btn btn-primary btn-sm" (click)="toggleForm()">
      {{ showForm() ? 'Annuler' : '+ Ajouter un contact' }}
    </button>
  </div>

  @if (showForm()) {
  <div class="suivi-form">
    <textarea placeholder="Commentaire (optionnel)..." [value]="newComment()"
      (input)="newComment.set($any($event.target).value)" rows="3">
      </textarea>
    <button class="btn btn-primary" (click)="addSuivi()" [disabled]="submitting()">
      {{ submitting() ? 'Enregistrement...' : 'Enregistrer le contact' }}
    </button>
  </div>
  }

  <div class="suivi-list">
    @if (history().length === 0) {
    <p class="empty">Aucun contact enregistré pour le moment.</p>
    } @else {
    @for (suivi of history(); track suivi.id) {
    <div class="suivi-item">
      <div class="suivi-date">{{ dateFormatter.formatDateTime(suivi.date) }}</div>
      <div class="suivi-status">{{ suivi.status }}</div>
      @if (suivi.commentaire) {
      <div class="suivi-comment">{{ suivi.commentaire }}</div>
      }
    </div>
    }
    }
  </div>
</div>
